# ── Data ──────────────────────────────────────────────────────────────────────
task: insertion_usb
data_root: data/insertion_usb

# ── Training ──────────────────────────────────────────────────────────────────
epochs: 560
batch_size: 64
lr: 0.0001
weight_decay: 0.0001
nsteps: 2
num_workers: 4
train_ratio: 0.9
split_seed: 3072
frameskip: 1
num_steps: 5

# ── Vision ────────────────────────────────────────────────────────────────────
vision_key: front          # front | wrist | pointcloud
vision_type: image         # image | pc
image_size: 224
vision_dim: 512
pc_in_channels: 6          # used when vision_type=pc

# ── Tactile ───────────────────────────────────────────────────────────────────
use_tactile: true
tactile_key: tactile_force_field_right
tactile_in_channels: 3
tactile_height: 10
tactile_width: 14
tactile_dim: 64

# ── Fusion ────────────────────────────────────────────────────────────────────
fusion_type: concat        # concat | gate | film | attn
fusion_latent_dim: null
fusion_hidden_dim: null

# ── Attention (used when fusion_type=attn) ────────────────────────────────────
attn_d_model: 256
attn_heads: 4
attn_layers: 2
attn_mlp_ratio: 4.0
attn_dropout: 0.0

# ── Regularization ────────────────────────────────────────────────────────────
reg_loss_type: vc          # vc | sigreg
use_proj: false
reg_on_vision_only: true

# VC loss
cov_coeff: 1.0
std_coeff: 1.0

# SIGReg loss (used when reg_loss_type=sigreg)
sigreg_coeff: 0.1
sigreg_knots: 17
sigreg_num_proj: 1024

# Shared
sim_coeff_t: 0.1
idm_coeff: 0.1
idm_after_proj: false
sim_t_after_proj: false

# ── Checkpointing ─────────────────────────────────────────────────────────────
save_dir: logs/ckpts
ckpt_every_n_steps: 10000

# ── W&B ───────────────────────────────────────────────────────────────────────
wandb: false
wandb_project: vt-wm
wandb_entity: null
wandb_save_dir: logs/wandb
wandb_name: null

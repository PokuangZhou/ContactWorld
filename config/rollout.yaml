# ── Paths ─────────────────────────────────────────────────────────────────────
ckpt_path: logs/ckpts/insertion_usb/front/vc/tactile_force_field_right/concat/100000.ckpt
data_root: /data/insertion_usb # need update with your current setting
output_dir: rollout/front_tacff
plot_filename: rollout_plot.png
json_filename: rollout_metrics.json
plot_title: "Multi-step Rollout Error"

# ── Vision ────────────────────────────────────────────────────────────────────
vision_key: front          # front | wrist | pointcloud
vision_type: image         # image | pc
image_size: 224
vision_dim: 512
pc_in_channels: 3          # used when vision_type=pc

# ── Tactile ───────────────────────────────────────────────────────────────────
use_tactile: true
tactile_key: tactile_force_field_right
tactile_in_channels: 3
tactile_height: 10
tactile_width: 14
tactile_dim: 64

# ── Fusion ────────────────────────────────────────────────────────────────────
fusion_type: concat        # concat | gate | film | attn
fusion_latent_dim: null
fusion_hidden_dim: null

# ── Attention (used when fusion_type=attn) ────────────────────────────────────
attn_d_model: 256
attn_heads: 4
attn_layers: 2
attn_mlp_ratio: 4.0
attn_dropout: 0.0

# ── Regularization ────────────────────────────────────────────────────────────
reg_loss_type: vc          # vc | sigreg
use_proj: false
reg_on_vision_only: true

# VC loss
cov_coeff: 1.0
std_coeff: 1.0

# SIGReg loss (used when reg_loss_type=sigreg)
sigreg_coeff: 0.1
sigreg_knots: 17
sigreg_num_proj: 1024

# Shared
sim_coeff_t: 0.1
idm_coeff: 0.1
idm_after_proj: false
sim_t_after_proj: false

# ── Rollout ───────────────────────────────────────────────────────────────────
history_size: 1
max_rollout: 6
action_mode: all           # gt | random_uniform | zero | all
batch_size: 128
num_workers: 6
seed: 3072
